name: Fork CI

# Our own gate. The inherited upstream workflows exercise the whole Xray surface
# and depend on things this repository does not carry, so they report failures
# unrelated to this fork. This workflow covers the repository as it is: format,
# build, vet over every package, race tests over every package, and the cross
# builds.

on:
  push:
    branches: [main, 'readpath-robustness', 'writer-delivery-guarantee']
  pull_request:
  workflow_dispatch:

jobs:
  repository:
    name: repository (build + vet + race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true

      - name: format check
        # Use the project's own vformat (gofumpt-based), not plain gofmt: the
        # inherited check-format job uses it, and plain gofmt accepts files it
        # rejects — which is how a spec slipped through and reddened the build.
        run: go run ./infra/vformat/main.go -mode check

      - name: build
        run: go build ./...

      - name: vet
        # Whole repository, no exclusions: "go vet" also reports the findings of
        # the packages it has to build, so a finding in a widely imported package
        # has to redden the gate too.
        run: go vet ./...

      - name: test (race)
        # Whole repository, not just the packages this fork touched: the race
        # detector is only useful as a gate when nothing is excluded from it.
        # The timeout is per package and leaves room for the transport and
        # scenario tests that sleep.
        run: go test -race -count=1 -timeout 1800s ./...

  fedarisha:
    name: fedarisha transport (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true

      - name: test (race)
        # The fast signal for the transport that got the most changes: the
        # repository gate above needs far longer to produce a verdict.
        run: go test -race -count=1 -timeout 600s ./proxy/fedarisha/...

  cross-build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-x64,  goos: darwin, goarch: amd64 }
          - { target: darwin-arm64, goos: darwin, goarch: arm64 }
          - { target: linux-x64,    goos: linux,   goarch: amd64 }
          - { target: linux-arm64,  goos: linux,   goarch: arm64 }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-s -w' -o xray ./main

      - name: smoke (version)
        run: |
          # A cross-built binary cannot run here, so assert it is a real
          # executable for the target rather than silently empty.
          test -s xray
          file xray || true